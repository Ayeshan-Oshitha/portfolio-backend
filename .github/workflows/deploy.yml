name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './publish'

# Two deploys racing would run `database update` concurrently against the same Neon branch.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Portfolio.sln

      - name: Build
        run: dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # Migrations run here and never at function startup — concurrent Function App
      # instances would race each other applying the same migration.
      #
      # Use Neon's DIRECT (non-pooled) connection string for this step. Migrations issue
      # DDL and the pooler is the wrong endpoint for that; the runtime app still uses the
      # pooled string via the ConnectionStrings__Default app setting.
      - name: Apply migrations
        env:
          ConnectionStrings__Default: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: dotnet ef database update --project Portfolio.API --no-build --configuration Release

      - name: Publish
        run: >-
          dotnet publish Portfolio.API/Portfolio.API.csproj
          --configuration Release
          --no-build
          --output ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
