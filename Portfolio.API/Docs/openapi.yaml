openapi: 3.1.0

info:
  title: Portfolio CMS API
  version: "1.0.0"
  description: |
    One headless CMS API powering three frontends — the agency portfolio, the personal
    portfolio, and the admin SPA. There are no duplicated rows per site: every visible entity
    carries per-site visibility flags and the caller asks for the site it wants.

    ## Two surfaces

    * `/public/*` — anonymous, read-only, cacheable. Returns only published, non-deleted rows
      that are visible on the requested site.
    * `/admin/*` — JWT required, full CRUD, returns drafts and metadata.

    ## Conventions

    * `?site=` is **required** on every public endpoint with site visibility. A missing site is a
      `400` with code `site_required` — never "return everything".
    * Lists return `{ items, page, pageSize, total }`. `pageSize` defaults to 20 and is capped
      at 100.
    * Errors are RFC 7807 `application/problem+json` with a stable `code`. Match on `code`,
      never on `detail`.
    * Public GETs send `Cache-Control: public, max-age=300` and an `ETag`; send
      `If-None-Match` to get a `304`. Admin responses are `Cache-Control: no-store`.
    * Timestamps are `timestamptz`, always UTC. Enums travel as their `snake_case` names.

    This document is hand-authored. When a route changes, change it here too.

servers:
  - url: http://localhost:7060/api
    description: Local Functions host
  - url: https://<your-function-app>.azurewebsites.net/api
    description: Deployed Function App

tags:
  - name: public
    description: Anonymous, cacheable reads for the two public sites.
  - name: admin
    description: JWT-protected CRUD for the admin SPA.
  - name: auth
    description: Sign-in, token rotation and the account lifecycle.
  - name: ops
    description: Health and diagnostics.

# Everything requires a bearer token unless an operation opts out with `security: []`.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Readiness check
      description: |
        Readiness, not liveness — it round-trips to Postgres. Expect roughly a second on the
        first request after Neon has been idle; that is the documented cold start, not a failure.
      security: []
      responses:
        "200":
          description: The worker can reach the database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [healthy] }
                  database: { type: string, examples: [ok] }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [unhealthy] }
                  database: { type: string, examples: [unreachable] }

  # ----------------------------------------------------------------------------- public
  /public/projects:
    get:
      tags: [public]
      operationId: getPublicProjects
      summary: List published projects for one site
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - name: tag
          in: query
          description: Slug of a technology tag.
          schema: { type: string }
        - name: category
          in: query
          description: Slug of a category tag (`is_technology = false`).
          schema: { type: string }
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicProjectList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/projects/{slug}:
    get:
      tags: [public]
      operationId: getPublicProjectBySlug
      summary: One published project
      security: []
      parameters:
        - $ref: "#/components/parameters/SlugPath"
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The project, with its tags and images.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/articles:
    get:
      tags: [public]
      operationId: getPublicArticles
      summary: List published articles for one site
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - name: tag
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicArticleList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/articles/{slug}:
    get:
      tags: [public]
      operationId: getPublicArticleBySlug
      summary: One published article
      security: []
      parameters:
        - $ref: "#/components/parameters/SlugPath"
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The article.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/services:
    get:
      tags: [public]
      operationId: getPublicServices
      summary: List published services for one site
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicServiceList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/services/{slug}:
    get:
      tags: [public]
      operationId: getPublicServiceBySlug
      summary: One published service
      security: []
      parameters:
        - $ref: "#/components/parameters/SlugPath"
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The service, with its features.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/pricing/combos:
    get:
      tags: [public]
      operationId: getPublicComboPricingPlans
      summary: List combo packs
      description: |
        Plans with no owning service (`service_id is null`). This is a separate route rather than
        an optional `?serviceId=`: absence of a query parameter must never silently change the
        `where` clause.
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicPricingPlanList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/pricing/services/{serviceId}:
    get:
      tags: [public]
      operationId: getPublicServicePricingPlans
      summary: List one service's pricing tiers
      security: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/SiteRequired"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicPricingPlanList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/faqs:
    get:
      tags: [public]
      operationId: getPublicFaqs
      summary: List published FAQs for one site
      description: Returns a bare array — the FAQ list is small enough that paging would only get in the way.
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The site's FAQs, in sort order.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaqResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/tags:
    get:
      tags: [public]
      operationId: getPublicTags
      summary: List tags
      description: Tags carry no site visibility, so there is no `?site=` here.
      security: []
      parameters:
        - $ref: "#/components/parameters/IsTechnology"
        - $ref: "#/components/parameters/TechnologyCategory"
      responses:
        "200":
          description: The tags, in sort order.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /public/home:
    get:
      tags: [public]
      operationId: getPublicHome
      summary: Everything one home page needs
      description: One round trip instead of six — the featured slices for that site, plus its FAQs.
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The home page payload.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  # ------------------------------------------------------------------------------- auth
  /admin/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Request an admin account
      description: |
        Creates a `pending` account and deliberately returns no token — a super admin approves
        first. Anonymous by design.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: The pending account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Email + password sign-in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Bad credentials (`invalid_credentials`), an account still awaiting approval
            (`account_pending`), or one that was rejected or disabled.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /admin/auth/google:
    post:
      tags: [auth]
      operationId: googleSignIn
      summary: Exchange a Google ID token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate a refresh token
      description: The old token is revoked as the new pair is issued — refresh tokens are single-use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke one refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in account
      responses:
        "200":
          description: The caller's own user record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password
      description: Verifies the current password and revokes every refresh token on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------------------ users
  /admin/users:
    get:
      tags: [admin]
      operationId: getUsers
      summary: List admin accounts
      description: Super admin only.
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}:
    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Soft-delete an account
      description: Super admin only.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/approve:
    post:
      tags: [admin]
      operationId: approveUser
      summary: Approve a pending account
      description: Super admin only. The account can sign in from this point.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectUser
      summary: Reject a pending account
      description: Super admin only. The reason is stored on the row.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectUserRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/disable:
    post:
      tags: [admin]
      operationId: disableUser
      summary: Disable an approved account
      description: Super admin only.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------- projects
  /admin/projects:
    get:
      tags: [admin]
      operationId: getAdminProjects
      summary: List projects, drafts included
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - $ref: "#/components/parameters/IsPublished"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminProjectResponse" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: The created project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/projects/{id}:
    get:
      tags: [admin]
      operationId: getAdminProjectById
      summary: One project, drafts included
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateProject
      summary: Replace a project
      description: A full replacement — every field is written as given.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminProject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      operationId: deleteProject
      summary: Soft-delete a project
      description: The Neon Object Storage assets are left in place — only a hard delete destroys those.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/projects/{id}/publish:
    post:
      tags: [admin]
      operationId: setProjectPublished
      summary: Publish or unpublish a project
      description: Going live the first time stamps `published_at`.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPublishedRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminProject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/projects/reorder:
    post:
      tags: [admin]
      operationId: reorderProjects
      summary: Bulk sort order for one site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/projects/{id}/images:
    post:
      tags: [admin]
      operationId: addProjectImage
      summary: Attach an uploaded image
      description: |
        Called after the browser has uploaded straight to Neon Object Storage using a presigned URL from
        `/admin/media/presigned-upload`. Image bytes never reach this API. `altText` is required, and
        setting `isPrimary` clears the previous primary in the same transaction.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectImageRequest" }
      responses:
        "201":
          description: The attached image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectImageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/projects/{id}/images/{imageId}:
    put:
      tags: [admin]
      operationId: updateProjectImage
      summary: Replace an image row
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/ImageIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectImageRequest" }
      responses:
        "200":
          description: The updated image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectImageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: deleteProjectImage
      summary: Remove an image
      description: |
        The one hard delete that exists today. The Neon Object Storage asset is destroyed after the row is
        committed; a failed destroy is logged, not surfaced.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/ImageIdPath"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/projects/{id}/images/reorder:
    post:
      tags: [admin]
      operationId: reorderProjectImages
      summary: Bulk sort order for one project's images
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildReorderRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------- articles
  /admin/articles:
    get:
      tags: [admin]
      operationId: getAdminArticles
      summary: List articles, drafts included
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - $ref: "#/components/parameters/IsPublished"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of articles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
