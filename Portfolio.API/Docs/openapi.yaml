  # ------------------------------------------------------------------------------ media
  /admin/media/presigned-upload:
    post:
      tags: [admin]
      operationId: createPresignedUpload
      summary: Presign a direct-to-Neon-Object-Storage upload
      description: |
        Image bytes never reach this API. The browser PUTs the file straight to Neon Object
        Storage using the returned URL, then calls the entity's image endpoint with the
        `objectKey`, dimensions and alt text.

        The client sends a `target` rather than a folder path, so a stolen admin token cannot
        write anywhere else in the bucket. `slug` is required when the target is `projects` or
        `articles`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignedUploadRequest" }
      responses:
        "200":
          description: A presigned PUT URL, valid for a short window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignedUploadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `/admin/auth/login`, `/admin/auth/google` or `/admin/auth/refresh`,
        sent as `Authorization: Bearer <token>`. Validated in middleware for everything under
        `/admin/*` except the register, login, google, refresh and logout routes.

  headers:
    ETag:
      description: Version of this payload. Send it back as `If-None-Match` to get a `304`.
      schema: { type: string }
    PublicCacheControl:
      description: Always `public, max-age=300` on public GETs.
      schema: { type: string }

  parameters:
    SiteRequired:
      name: site
      in: query
      required: true
      description: |
        Which frontend is asking. Required — a missing site is a `400` with code `site_required`,
        never "return everything". This is the guard that stops personal content appearing on the
        agency site.
      schema: { $ref: "#/components/schemas/Site" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string }
    Featured:
      name: featured
      in: query
      description: Only rows featured on the requested site's home page.
      schema: { type: boolean }
    IsPublished:
      name: isPublished
      in: query
      description: Admin-only filter. Omit to get drafts and published rows alike.
      schema: { type: boolean }
    IsTechnology:
      name: isTechnology
      in: query
      description: "`true` for technology tags, `false` for category tags."
      schema: { type: boolean }
    TechnologyCategory:
      name: category
      in: query
      description: Only meaningful for technology tags.
      schema: { $ref: "#/components/schemas/TechCategory" }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeatureIdPath:
      name: featureId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageIdPath:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlugPath:
      name: slug
      in: path
      required: true
      description: Stable once published — changing a live slug breaks links.
      schema: { type: string }

  responses:
    NoContent:
      description: Done. No body.
    NotModified:
      description: Your `If-None-Match` matched. No body.
    BadRequest:
      description: Validation failed. See `code`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SiteRequired:
      description: |
        `?site=` was missing (`site_required`) or was not a known site (`validation_failed`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, expired or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but the role is not allowed here — super admin only.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such row, or it is soft-deleted.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        The change collides with existing data — `slug_taken`, `tag_in_use`, `email_taken`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Auth:
      description: An access token, a rotating refresh token, and the signed-in account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    AdminUser:
      description: The account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUserResponse" }
    AdminProject:
      description: The project, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminProjectResponse" }
    AdminArticle:
      description: The article, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminArticleResponse" }
    AdminService:
      description: The service, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminServiceResponse" }
    AdminPricingPlan:
      description: The pricing plan, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminPricingPlanResponse" }
    AdminFaq:
      description: The FAQ, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminFaqResponse" }
    AdminTag:
      description: The tag.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminTagResponse" }

    PublicProjectList:
      description: A page of published projects.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectResponse" }
    PublicArticleList:
      description: A page of published articles.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ArticleResponse" }
    PublicServiceList:
      description: A page of published services.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceResponse" }
    PublicPricingPlanList:
      description: A page of published pricing plans.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PricingPlanResponse" }

  schemas:
    # ---------------------------------------------------------------------------- enums
    Site:
      type: string
      enum: [agency, personal]
      description: The two public frontends.
    TechCategory:
      type: string
      enum:
        - frontend
        - backend
        - language
        - database
        - tool_or_platform
        - cloud_devops
        - ai_ml_dl
        - agentic_ai
        - design
        - other
    PriceType:
      type: string
      enum: [fixed, starting_from, hourly, monthly, custom]
    UserRole:
      type: string
      enum: [super_admin, admin]
    UserStatus:
      type: string
      enum: [pending, approved, rejected, disabled]
    MediaTarget:
      type: string
      enum: [projects, services, tags, articles]

    # -------------------------------------------------------------------------- envelope
    Problem:
      type: object
      description: |
        RFC 7807. Switch on `code`, which is stable; `detail` is human-readable and may change.
      properties:
        type: { type: string }
        title: { type: string, examples: ["Bad Request"] }
        status: { type: integer, examples: [400] }
        detail: { type: string }
        code:
          type: string
          description: |
            Stable machine-readable code — `site_required`, `validation_failed`, `slug_taken`,
            `tag_in_use`, `account_pending`, `invalid_credentials`, and so on.
          examples: [site_required]
      required: [status, title, code]

    Paged:
      type: object
      description: The envelope every list endpoint returns.
      properties:
        page: { type: integer, examples: [1] }
        pageSize: { type: integer, examples: [20] }
        total:
          type: integer
          description: Total matching rows, not the size of this page.
      required: [items, page, pageSize, total]

    # ---------------------------------------------------------------------- public reads
    TagResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isTechnology: { type: boolean }
        technologyCategory:
          oneOf:
            - $ref: "#/components/schemas/TechCategory"
            - type: "null"
        iconUrl: { type: [string, "null"] }
        colorHex: { type: [string, "null"], examples: ["#3178c6"] }
        sortOrder: { type: integer }
      required: [id, name, slug, isTechnology, sortOrder]

    ProjectImageResponse:
      type: object
      description: |
        The API stores the Neon Object Storage `objectKey` plus dimensions and alt text — never
        image bytes.
      properties:
        id: { type: string, format: uuid }
        objectKey: { type: string, examples: ["portfolio/projects/acme-site/hero"] }
        url: { type: string, format: uri }
        altText: { type: string }
        width: { type: integer }
        height: { type: integer }
        isPrimary:
          type: boolean
          description: Exactly one image per project is primary.
        sortOrder: { type: integer }
      required: [id, objectKey, url, altText, width, height, isPrimary, sortOrder]

    ProjectResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        year: { type: integer }
        shortDescription: { type: string }
        description:
          type: string
          description: Raw markdown. Sanitize on render, not on write.
        websiteUrl: { type: [string, "null"], format: uri }
        problem: { type: [string, "null"] }
        solution: { type: [string, "null"] }
        whatWeDelivered: { type: [string, "null"] }
        proof: { type: [string, "null"] }
        clientName: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        seoTitle: { type: [string, "null"] }
        seoDescription: { type: [string, "null"] }
        featured:
          type: boolean
          description: Featured on the requested site's home page.
        sortOrder:
          type: integer
          description: The requested site's sort order, already resolved.
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        images:
          type: array
          items: { $ref: "#/components/schemas/ProjectImageResponse" }
      required: [id, slug, title, year, shortDescription, description, featured, sortOrder, tags, images]

    ArticleResponse:
      type: object
      description: >
        An article renders from its own contentMarkdown, and may also link out to Medium as a
        cross-post. contentMarkdown has every media:// reference already resolved to a real URL.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string }
        slug: { type: [string, "null"] }
        publishedDate: { type: string, format: date }
        mediumUrl: { type: [string, "null"], format: uri }
        coverImageKey:
          type: [string, "null"]
          description: Neon Object Storage object key.
        contentMarkdown:
          type: [string, "null"]
          description: >
            Markdown body with every media://articles/... reference resolved to a real Neon
            Object Storage URL. Ready to hand straight to a Markdown renderer.
        featured: { type: boolean }
        sortOrder: { type: integer }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
      required: [id, title, excerpt, publishedDate, featured, sortOrder, tags]

    ServiceFeatureResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        iconName: { type: [string, "null"] }
        sortOrder: { type: integer }
      required: [id, title, sortOrder]

    ServiceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        shortDescription: { type: string }
        description: { type: string }
        iconName: { type: [string, "null"] }
        iconObjectKey: { type: [string, "null"] }
        heroImageId: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        featured: { type: boolean }
        sortOrder: { type: integer }
        features:
          type: array
          items: { $ref: "#/components/schemas/ServiceFeatureResponse" }
      required: [id, slug, name, shortDescription, description, featured, sortOrder, features]

    PricingPlanFeatureResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        isIncluded:
          type: boolean
          description: "`false` renders as a struck-through line — what this tier does not include."
        sortOrder: { type: integer }
      required: [id, text, isIncluded, sortOrder]

    PricingPlanResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        serviceId:
          type: [string, "null"]
          format: uuid
          description: Null means this is a combo pack rather than one service's tier.
        name: { type: string }
        tagline: { type: [string, "null"] }
        priceAmount:
          type: [number, "null"]
          description: Null is valid and means "Custom / Contact us" — it is not zero.
        currency: { type: string, examples: [USD] }
        priceType: { $ref: "#/components/schemas/PriceType" }
        deliveryDays: { type: [integer, "null"] }
        deliveryText: { type: [string, "null"] }
        description: { type: string }
        isPopular: { type: boolean }
        ctaLabel: { type: [string, "null"] }
        ctaUrl: { type: [string, "null"], format: uri }
        featured: { type: boolean }
        sortOrder: { type: integer }
        tierOrder:
          type: integer
          description: Position within its service's ladder of tiers.
        features:
          type: array
          items: { $ref: "#/components/schemas/PricingPlanFeatureResponse" }
      required: [id, name, currency, priceType, description, isPopular, featured, sortOrder, tierOrder, features]

    FaqResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string }
        category: { type: [string, "null"] }
        featured: { type: boolean }
        sortOrder: { type: integer }
      required: [id, question, answer, featured, sortOrder]

    HomeResponse:
      type: object
      description: The featured slices for one site, plus its FAQs.
      properties:
        featuredProjects:
          type: array
          items: { $ref: "#/components/schemas/ProjectResponse" }
        featuredArticles:
          type: array
          items: { $ref: "#/components/schemas/ArticleResponse" }
        featuredServices:
          type: array
          items: { $ref: "#/components/schemas/ServiceResponse" }
        featuredPricingPlans:
          type: array
          items: { $ref: "#/components/schemas/PricingPlanResponse" }
        faqs:
          type: array
          items: { $ref: "#/components/schemas/FaqResponse" }
      required: [featuredProjects, featuredArticles, featuredServices, featuredPricingPlans, faqs]

    # ------------------------------------------------------------------- shared fragments
    SiteVisibility:
      type: object
      description: |
        Per-site visibility, the reason there is one row per entity rather than one per site.
        `featuredOn*` requires the matching `showOn*`.
      properties:
        showOnAgency: { type: boolean, default: false }
        featuredOnAgency: { type: boolean, default: false }
        agencySortOrder: { type: integer, default: 0 }
        showOnPersonal: { type: boolean, default: false }
        featuredOnPersonal: { type: boolean, default: false }
        personalSortOrder: { type: integer, default: 0 }

    Timestamps:
      type: object
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [createdAt, updatedAt]

    # ---------------------------------------------------------------------- admin reads
    AdminUserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        lastLoginAt: { type: [string, "null"], format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, email, firstName, lastName, role, status, createdAt]

    AdminTagResponse:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
            isTechnology: { type: boolean }
            technologyCategory:
              oneOf:
                - $ref: "#/components/schemas/TechCategory"
                - type: "null"
            iconObjectKey: { type: [string, "null"] }
            iconUrl: { type: [string, "null"] }
            colorHex: { type: [string, "null"] }
            sortOrder: { type: integer }
          required: [id, name, slug, isTechnology, sortOrder]

    AdminProjectResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            title: { type: string }
            year: { type: integer }
            shortDescription: { type: string }
            description: { type: string }
            websiteUrl: { type: [string, "null"], format: uri }
            problem: { type: [string, "null"] }
            solution: { type: [string, "null"] }
            whatWeDelivered: { type: [string, "null"] }
            proof: { type: [string, "null"] }
            clientName: { type: [string, "null"] }
            isPublished: { type: boolean }
            publishedAt: { type: [string, "null"], format: date-time }
            seoTitle: { type: [string, "null"] }
            seoDescription: { type: [string, "null"] }
            tags:
              type: array
              items: { $ref: "#/components/schemas/AdminTagResponse" }
            images:
              type: array
              items: { $ref: "#/components/schemas/ProjectImageResponse" }
          required: [id, slug, title, year, shortDescription, description, isPublished, tags, images]

    AdminArticleResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            excerpt: { type: string }
            slug: { type: [string, "null"] }
            publishedDate: { type: string, format: date }
            mediumUrl: { type: [string, "null"], format: uri }
            coverImageKey: { type: [string, "null"] }
            contentMarkdown:
              type: [string, "null"]
              description: Raw Markdown, media:// tokens unresolved — this is what the editor edits.
            isPublished: { type: boolean }
            tags:
              type: array
              items: { $ref: "#/components/schemas/AdminTagResponse" }
          required: [id, title, excerpt, publishedDate, isPublished, tags]

    AdminServiceResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            shortDescription: { type: string }
            description: { type: string }
            iconName: { type: [string, "null"] }
            iconObjectKey: { type: [string, "null"] }
            heroImageId: { type: [string, "null"] }
            isPublished: { type: boolean }
            publishedAt: { type: [string, "null"], format: date-time }
            features:
              type: array
              items: { $ref: "#/components/schemas/ServiceFeatureResponse" }
          required: [id, slug, name, shortDescription, description, isPublished, features]

    AdminPricingPlanResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            serviceId: { type: [string, "null"], format: uuid }
            name: { type: string }
            tagline: { type: [string, "null"] }
            priceAmount: { type: [number, "null"] }
            currency: { type: string }
            priceType: { $ref: "#/components/schemas/PriceType" }
            deliveryDays: { type: [integer, "null"] }
            deliveryText: { type: [string, "null"] }
            description: { type: string }
            isPopular: { type: boolean }
            ctaLabel: { type: [string, "null"] }
            ctaUrl: { type: [string, "null"], format: uri }
            isPublished: { type: boolean }
            sortOrder: { type: integer }
            features:
              type: array
              items: { $ref: "#/components/schemas/PricingPlanFeatureResponse" }
          required: [id, name, currency, priceType, description, isPopular, isPublished, sortOrder, features]

    AdminFaqResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            question: { type: string }
            answer: { type: string }
            category: { type: [string, "null"] }
            sortOrder: { type: integer }
            isPublished: { type: boolean }
          required: [id, question, answer, sortOrder, isPublished]

    # ------------------------------------------------------------------- auth contracts
    RegisterRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        password:
          type: string
          format: password
          minLength: 8
        confirmPassword: { type: string, format: password }
      required: [firstName, lastName, email, password, confirmPassword]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      required: [email, password]

    GoogleSignInRequest:
      type: object
      properties:
        idToken:
          type: string
          description: The ID token from Google Sign-In, verified against Google's keys server-side.
      required: [idToken]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken: { type: string }
      required: [refreshToken]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }
        confirmNewPassword: { type: string, format: password }
      required: [currentPassword, newPassword, confirmNewPassword]

    RejectUserRequest:
      type: object
      properties:
        reason: { type: string }
      required: [reason]

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        refreshToken:
          type: string
          description: Single-use. Refreshing rotates it and revokes the one you sent.
        refreshTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/AdminUserResponse" }
      required: [accessToken, expiresAt, refreshToken, refreshTokenExpiresAt, user]

    # ---------------------------------------------------------------- admin write bodies
    SetPublishedRequest:
      type: object
      properties:
        isPublished: { type: boolean }
      required: [isPublished]

    ReorderRequest:
      type: object
      description: Bulk `sort_order` update for one site, applied in a single save.
      properties:
        site: { $ref: "#/components/schemas/Site" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
      required: [site, items]

    ChildReorderRequest:
      type: object
      description: |
        Reordering a parent's children — images or features. No `site`: children are not
        site-scoped.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
      required: [items]

    ReorderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        sortOrder: { type: integer }
      required: [id, sortOrder]

    CreateProjectRequest:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - type: object
          description: |
            Also used for `PUT` — an update is a full replacement. Omit `slug` to have one
            generated from the title; a published project's slug should stay put.
          properties:
            title: { type: string }
            slug: { type: string }
            year: { type: integer }
            shortDescription: { type: string }
            description: { type: string, description: Raw markdown. }
            websiteUrl: { type: string, format: uri }
            problem: { type: string }
            solution: { type: string }
            whatWeDelivered: { type: string }
            proof: { type: string }
            clientName: { type: string }
            isPublished: { type: boolean, default: false }
            seoTitle: { type: string }
            seoDescription: { type: string }
            tagIds:
              type: array
              items: { type: string, format: uuid }
          required: [title, year, shortDescription, description]

    CreateArticleRequest:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - type: object
          description: Also used for `PUT` — an update is a full replacement.
          properties:
            title: { type: string }
            excerpt: { type: string }
            slug: { type: string }
            publishedDate: { type: string, format: date }
            mediumUrl:
              type: string
              format: uri
              description: Optional cross-post link. Must be an absolute URL when present.
            coverImageKey: { type: string, description: Neon Object Storage object key. }
            contentMarkdown:
              type: string
              description: >
                Raw Markdown. Embed media with a media://articles/... reference (e.g.
                media://articles/images/example.png) instead of a real URL — insert the
                reference after uploading via POST /admin/media/presigned-upload.
            isPublished: { type: boolean, default: false }
            tagIds:
              type: array
              items: { type: string, format: uuid }
          required: [title, excerpt, publishedDate]

    CreateServiceRequest:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - type: object
          description: Also used for `PUT` — an update is a full replacement.
          properties:
            name: { type: string }
            slug: { type: string }
            shortDescription: { type: string }
            description: { type: string }
            iconName: { type: string }
            iconObjectKey: { type: string }
            heroImageId: { type: string }
            isPublished: { type: boolean, default: false }
          required: [name, shortDescription, description]

    CreatePricingPlanRequest:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - type: object
          description: Also used for `PUT` — an update is a full replacement.
          properties:
            serviceId:
              type: string
              format: uuid
              description: Omit or send null for a combo pack.
            name: { type: string }
            tagline: { type: string }
            priceAmount:
              type: number
              description: Omit for "Custom / Contact us". Do not send 0 to mean that.
            currency: { type: string, examples: [USD] }
            priceType: { $ref: "#/components/schemas/PriceType" }
            deliveryDays: { type: integer }
            deliveryText: { type: string }
            description: { type: string }
            isPopular: { type: boolean, default: false }
            ctaLabel: { type: string }
            ctaUrl: { type: string, format: uri }
            isPublished: { type: boolean, default: false }
            sortOrder: { type: integer, default: 0 }
          required: [name, description]

    CreateFaqRequest:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - type: object
          description: Also used for `PUT` — an update is a full replacement.
          properties:
            question: { type: string }
            answer: { type: string }
            category: { type: string }
            sortOrder: { type: integer, default: 0 }
            isPublished: { type: boolean, default: false }
          required: [question, answer]

    CreateTagRequest:
      type: object
      description: |
        Also used for `PUT`. A technology tag requires `technologyCategory` and an icon; a
        category tag must have neither.
      properties:
        name: { type: string }
        slug: { type: string }
        isTechnology: { type: boolean, default: false }
        technologyCategory: { $ref: "#/components/schemas/TechCategory" }
        iconObjectKey: { type: string }
        iconUrl: { type: string, format: uri }
        colorHex: { type: string, examples: ["#3178c6"] }
        sortOrder: { type: integer, default: 0 }
      required: [name]

    AddProjectImageRequest:
      type: object
      description: |
        Also used for `PUT`. Sent after the browser has uploaded to Neon Object Storage — the API stores
        the `objectKey`, dimensions and alt text, never the bytes.
      properties:
        objectKey: { type: string }
        url: { type: string, format: uri }
        altText:
          type: string
          description: Required on every image. A blank value is rejected.
        width: { type: integer }
        height: { type: integer }
        isPrimary:
          type: boolean
          default: false
          description: Setting this clears the previous primary in the same transaction.
        sortOrder: { type: integer, default: 0 }
      required: [objectKey, url, altText, width, height]

    AddServiceFeatureRequest:
      type: object
      description: Also used for `PUT`.
      properties:
        title: { type: string }
        description: { type: string }
        iconName: { type: string }
        sortOrder: { type: integer, default: 0 }
      required: [title]

    AddPricingPlanFeatureRequest:
      type: object
      description: Also used for `PUT`.
      properties:
        text: { type: string }
        isIncluded: { type: boolean, default: false }
        sortOrder: { type: integer, default: 0 }
      required: [text]

    PresignedUploadRequest:
      type: object
      properties:
        target: { $ref: "#/components/schemas/MediaTarget" }
        slug:
          type: string
          description: |
            Required when `target` is `projects` or `articles`. Re-slugged server-side, so
            nothing outside the base folder is reachable.
        objectKey:
          type: string
          description: Overwrite a specific object instead of creating a new one.
      required: [target]

    PresignedUploadResponse:
      type: object
      description: PUT the file straight to `uploadUrl` with a matching content type.
      properties:
        uploadUrl: { type: string, format: uri }
        objectKey: { type: string, examples: ["portfolio/projects/acme-site/hero"] }
        expiresAt: { type: string, format: date-time }
      required: [uploadUrl, objectKey, expiresAt]
